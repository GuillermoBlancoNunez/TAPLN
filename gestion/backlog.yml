# =============================================================================
# Backlog del proyecto TAPLN · TA1C (detección y spoiling de clickbait, LLM + RAG)
#
# Plan inicial (línea base). Tras el bootstrap, el estado vivo está en el GitHub
# Project; este fichero se conserva para comparar plan y realidad en la memoria.
#
#   Validar:   uv run --with pyyaml python gestion/bootstrap_github.py validate
#   Informe:   uv run --with pyyaml python gestion/bootstrap_github.py report -o gestion/ROADMAP.md
#   Simular:   uv run --with pyyaml python gestion/bootstrap_github.py plan
#   Volcar:    uv run --with pyyaml python gestion/bootstrap_github.py apply
#
# Convenciones
#   - Tareas numeradas en orden de ejecución: una tarea solo depende de números
#     menores (depends_on = tareas que deben estar terminadas antes de empezar).
#     En un repo vacío, la tarea N es el issue #N. En los textos, «#N» = tarea N.
#   - Reparto rotatorio: los tres trabajan en todas las áreas. owners[0] es quien
#     hace la tarea (y abre la PR); en tareas compartidas participan todos.
#   - reviewers: quien aprueba la PR; rota para que nadie tenga siempre el mismo
#     revisor. En decisiones, el ADR lo aprueban los otros dos.
#   - points: 1 punto ≈ 2 h de una persona (recalibrar con la velocity del S1).
#   - priority: P0 = Must (no se recorta), P1 = Should, P2 = Could (ampliación).
#   - Cada experimento (tipo experimento) alimenta una decisión, que produce un ADR.
#   - Los IDs no se renumeran nunca: `apply` empareja cada issue con su tarea por el ID.
#     Las tareas añadidas tras el bootstrap (76–79) van al final y en GitHub quedan
#     detrás de las épicas (ver project.numbering_note).
#   - El repo será público al acabar (#79): nada de secretos, datos del corpus ni
#     material de la asignatura en git (CONTRIBUTING §14).
# =============================================================================

version: 2

project:
  repo: auto                 # se detecta del remoto «origin»; o escribe «usuario/repo»
  owner: auto                # dueño del GitHub Project: por defecto, el dueño del repo
  title: "TAPLN · TA1C"
  description: "Tablero ágil del proyecto TAPLN: detección y spoiling de clickbait en español (TA1C, IberLEF 2025) con LLM + RAG."
  base_branch: develop
  release_branch: main
  delivery_deadline: "2026-12-18 23:55 (Europe/Madrid)"
  delivery_target: 2026-12-17
  numbering_note: "Las tareas 76–79 se añadieron después del bootstrap. En GitHub van detrás de las épicas (#76–#84): la tarea 76 es el issue #85, la 79 el #88 y la épica E10 el #89, si no se crea ningún otro issue o PR antes de relanzar `apply`. El título de cada issue lleva siempre su número de tarea [NN]."

capacity:
  hours_per_point: 2
  points_per_member_per_sprint: 12   # ≈ 12 h/semana por persona en sprints de 2 semanas
  note: "Referencia inicial. Se recalibra en la Review del Sprint 1 con la velocity real."

# Sin roles: los tres trabajan en todas las áreas. Solo el portavoz lo exige el enunciado.
team:
  A: {github: GuillermoBlancoNunez, name: Guillermo, role: "Portavoz: interlocutor con el profesor (lo exige el enunciado)"}
  B: {github: MiguelBanosB, name: Miguel, role: ""}
  C: {github: fizge, name: fizge, role: ""}

sprints:
  - id: S1
    title: "Sprint 1 · Cimientos"
    start: 2026-10-26
    end: 2026-11-08
    goal: "Entorno, datos y medición listos; EDA y estado del arte de ambas tareas; baselines clásicos de T1; decisión del backend de inferencia (ADR-001)."
  - id: S2
    title: "Sprint 2 · Componentes RAG"
    start: 2026-11-09
    end: 2026-11-22
    goal: "Capas LLM y de recuperación; métricas oficiales; benchmarks de LLMs y embeddings (ADR-002, ADR-003); pipelines LLM + RAG v1 de T1 y T2; baselines de T2."
  - id: S3
    title: "Sprint 3 · Ajuste y decisiones"
    start: 2026-11-23
    end: 2026-12-06
    goal: "Benchmarks del enfoque de T1, de la recuperación y la generación de T2 y del juez LLM (ADR-004 a ADR-007); sistemas finales de T1 y T2; borrador de la arquitectura."
  - id: S4
    title: "Sprint 4 · Evaluación final y entrega"
    start: 2026-12-07
    end: 2026-12-18
    goal: "Congelación (ADR-009), evaluación única en test, ablaciones y eficiencia, memoria completa y entrega el 17-dic (plazo: 18-dic 23:55)."
  - id: DEF
    title: "Defensa"
    start: 2026-12-19
    end: null
    goal: "Presentación y ensayos para la defensa del día del examen."
  - id: PUB
    title: "Publicación"
    start: 2026-12-21
    end: 2027-01-10
    goal: "Tras la entrega y sin competir con ella: API de inferencia en Docker, encoder en Hugging Face Hub, README bilingüe y auditoría antes de hacer público el repo."

labels:
  types:
    epica:       {name: "tipo:épica", color: "3E4B9E", description: "Agrupa issues de un mismo bloque funcional"}
    feature:     {name: "tipo:feature", color: "1D76DB", description: "Funcionalidad del sistema"}
    experimento: {name: "tipo:experimento", color: "FBCA04", description: "Benchmark pre-registrado: rendimiento + recursos"}
    decision:    {name: "tipo:decisión", color: "D93F0B", description: "Reunión de los tres y ADR"}
    infra:       {name: "tipo:infra", color: "5319E7", description: "Plataforma, CI, datos, MLOps"}
    evaluacion:  {name: "tipo:evaluación", color: "0E8A16", description: "Métricas, juez LLM, estadística"}
    docs:        {name: "tipo:docs", color: "0075CA", description: "Memoria y documentación"}
    gestion:     {name: "tipo:gestión", color: "C5DEF5", description: "Proceso ágil y ceremonias"}
    entrega:     {name: "tipo:entrega", color: "B60205", description: "Entrega y defensa"}
    bug:         {name: "tipo:bug", color: "E11D21", description: "Algo no funciona como debería"}
  areas:
    gestion:     {name: "area:gestión", color: "BFD4F2", description: "Proceso y coordinación"}
    comun:       {name: "area:común", color: "C2E0C6", description: "Componentes compartidos por T1 y T2"}
    T1:          {name: "area:T1", color: "F9D0C4", description: "Tarea 1 · Detección"}
    T2:          {name: "area:T2", color: "FEF2C0", description: "Tarea 2 · Spoiling"}
    memoria:     {name: "area:memoria", color: "D4C5F9", description: "Memoria, entrega y defensa"}
  priorities:
    P0:          {name: "prio:P0", color: "B60205", description: "Must: imprescindible para la entrega"}
    P1:          {name: "prio:P1", color: "D93F0B", description: "Should: importante, recortable con justificación"}
    P2:          {name: "prio:P2", color: "FBCA04", description: "Could: ampliación si hay capacidad"}
  extra:
    - {name: "estado:bloqueado", color: "000000", description: "Bloqueado por una dependencia o un problema externo"}

board:
  current_sprint: S1
  status_options:
    - {name: "Backlog", color: GRAY, description: "Priorizado, sin comprometer en el sprint actual"}
    - {name: "Ready", color: BLUE, description: "Cumple la Definition of Ready y está en el sprint actual"}
    - {name: "In progress", color: YELLOW, description: "En curso (WIP máximo: 2 por persona)"}
    - {name: "In review", color: PURPLE, description: "PR abierta esperando revisión"}
    - {name: "Done", color: GREEN, description: "PR fusionada en develop y Definition of Done cumplida"}
  initial_status: {current_sprint: "Ready", other: "Backlog"}
  fields: {points: "Puntos", reviewer: "Revisor", start: "Inicio", end: "Fin"}
  team_review_option: "Equipo (2 aprobaciones)"
  views:
    - {name: "Tablero", layout: board, columns: Status, filter: "-label:\"tipo:épica\""}
    - {name: "Sprint actual", layout: board, columns: Status, filter: "milestone:\"{current_milestone}\" -label:\"tipo:épica\""}
    - {name: "Por persona", layout: table, group_by: Assignees, filter: "-label:\"tipo:épica\" -status:Done"}
    - {name: "Decisiones", layout: table, filter: "label:\"tipo:decisión\",\"tipo:experimento\""}
    - {name: "Épicas", layout: table, filter: "label:\"tipo:épica\""}
    - {name: "Roadmap", layout: roadmap, filter: "-label:\"tipo:épica\""}

# -----------------------------------------------------------------------------
# Épicas (bloques funcionales). Se crean después de las tareas, para que la
# tarea N coincida con el issue #N en un repo vacío.
# -----------------------------------------------------------------------------
epics:
  - id: E1
    title: "Gestión ágil y proceso"
    area: gestion
    goal: >-
      Trabajar con un proceso visible y verificable: tablero, revisión cruzada, ceremonias y
      trazabilidad de todo lo que irá al Diario de Trabajo.
  - id: E2
    title: "Plataforma: datos, infraestructura y MLOps"
    area: comun
    goal: >-
      Base técnica común y reproducible: estructura del repo, CI, capa de datos con guardarraíl
      anti-fuga, medición de recursos y ejecución en Colab/Kaggle.
  - id: E3
    title: "Evaluación y medición"
    area: comun
    goal: >-
      Métricas oficiales comparables con el ranking de TA1C, incertidumbre estadística y
      evaluación LLM-as-a-judge validada con anotación humana.
  - id: E4
    title: "Núcleo LLM + RAG compartido"
    area: comun
    goal: >-
      Elegir con evidencia (rendimiento y recursos) y construir los componentes compartidos:
      backend de inferencia, LLM generador, embeddings e índice.
  - id: E5
    title: "T1 · Detección de clickbait"
    area: T1
    goal: >-
      Clasificador LLM + RAG (few-shot dinámico) comparado con baselines clásicos y con encoders
      fine-tuneados, evaluado con macro-F1 sobre el reparto oficial.
  - id: E6
    title: "T2 · Spoiling"
    area: T2
    goal: >-
      Generador de spoilers de ≤280 caracteres con recuperación de pasajes del artículo,
      comparado con baselines extractivos y con el artículo completo.
  - id: E7
    title: "Evaluación final y análisis"
    area: comun
    goal: >-
      Congelar la arquitectura, evaluar una sola vez en test y analizar errores, ablaciones y
      eficiencia (rendimiento frente a recursos).
  - id: E8
    title: "Memoria"
    area: memoria
    goal: >-
      Memoria de ≤20 páginas con todos los apartados del enunciado, trazable a ficheros de
      results/ y a los ADR.
  - id: E9
    title: "Entrega y defensa"
    area: memoria
    goal: >-
      Entregar a tiempo un paquete instalable y verificado y preparar la defensa.
  - id: E10
    title: "Publicación del proyecto"
    area: comun
    goal: >-
      Convertir la práctica entregada en un proyecto público, reutilizable y seguro: servicio
      de inferencia, modelo en Hugging Face, README bilingüe y auditoría previa a la publicación.

# -----------------------------------------------------------------------------
# Riesgos (se revisan en cada Sprint Review)
# -----------------------------------------------------------------------------
risks:
  - id: R1
    risk: "Cómputo limitado (CPU + Colab/Kaggle con cuotas y GPU variable): retrasos y benchmarks no comparables."
    probability: Alta
    impact: Alto
    mitigation: "Modelos ≤12B cuantizados; caché de inferencias (#27); cada decisión se mide en un único entorno registrado; reservar la cuota semanal de GPU de Kaggle para los experimentos largos."
    owner: C
  - id: R2
    risk: "Fuga de test o sobreajuste a dev (muchas configuraciones sobre 100 ejemplos en T2)."
    probability: Media
    impact: Alto
    mitigation: "Guardarraíl de #11, una única ejecución en test (#61 y #62), IC95 y tests de significancia, criterios pre-registrados."
    owner: C
  - id: R3
    risk: "Métricas no comparables con el ranking oficial (configuración distinta de BERTScore, BLEU o ROUGE)."
    probability: Media
    impact: Medio
    mitigation: "#21 documenta y valida la configuración oficial antes de cualquier benchmark de T2."
    owner: C
  - id: R4
    risk: "Incompatibilidades de Python 3.13 con parte del stack (vLLM, bitsandbytes, llama-cpp-python)."
    probability: Media
    impact: Medio
    mitigation: "#13 lo verifica en Colab y Kaggle durante el Sprint 1; si falla, se fija 3.12 y se documenta en el Diario."
    owner: C
  - id: R5
    risk: "Retraso en la ruta crítica (#15 → #17 → #27 → #29 y #30 → #33)."
    probability: Media
    impact: Alto
    mitigation: "Trabajo en paralelo con un LLM provisional; revisión en ≤24 h para issues de la ruta crítica; seguimiento en cada standup."
    owner: A
  - id: R6
    risk: "PRs bloqueadas esperando revisión."
    probability: Media
    impact: Medio
    mitigation: "SLA de revisión 24–48 h, WIP ≤2 por persona, PRs pequeñas y CODEOWNERS para pedir revisión automáticamente."
    owner: A
  - id: R7
    risk: "Licencias: datos de TA1C sin licencia explícita y modelos con licencias restrictivas."
    probability: Baja
    impact: Medio
    mitigation: "Datos fuera de git desde #01 (se descargan de las fuentes oficiales); no redistribuirlos en el zip ni en el repo público; tabla de licencias en #47; modelos con licencia compatible; pesos publicados en #77 solo tras consultar a los organizadores."
    owner: C
  - id: R8
    risk: "Coste de contexto por la rotación: quien hace una tarea no siempre hizo la anterior."
    probability: Media
    impact: Medio
    mitigation: "El revisor de una tarea suele ser quien hará la siguiente que depende de ella; PRs con descripción y comando de prueba; demos en cada Sprint Review; ensayo de defensa (cada uno explica cualquier módulo)."
    owner: A
  - id: R9
    risk: "Cuello de botella de la memoria en el último sprint."
    probability: Alta
    impact: Alto
    mitigation: "Plantilla en S1 (#9), Diario continuo, borrador de arquitectura en S3, objetivo de entrega el 17-dic."
    owner: C
  - id: R10
    risk: "Indisponibilidad temporal de un miembro (exámenes, enfermedad)."
    probability: Media
    impact: Medio
    mitigation: "Capacidad declarada en cada Planning, recorte según el orden de prioridades, todo documentado en issues y PRs."
    owner: A
  - id: R11
    risk: "Al hacer público el repo quedan expuestos secretos, datos sin licencia, material de la asignatura o datos personales (el historial de git es permanente)."
    probability: Media
    impact: Alto
    mitigation: "Historial limpiado en #01 con un solo commit; gitleaks y nbstripout en pre-commit y CI (#10); Definition of Done y CONTRIBUTING §14; auditoría completa antes de publicar (#79); un secreto filtrado se revoca, no basta con borrarlo."
    owner: A

# Orden de recorte si la velocity real es menor que la planificada (los P0 no se recortan)
scope_cut:
  - "1. Todos los P2: #39, #41, #44, #48, #54 y #56."
  - "2. #24: fijar el índice con la micro-comparativa de #14 y documentarlo en ADR-002."
  - "3. #36: mantener los IC95 por bootstrap de #21 y prescindir de los tests pareados."
  - "4. #45 + #51: usar un único juez sin benchmark, declarado como limitación en la memoria."
  - "5. #20: agregar resultados con un script mínimo sin decisión de herramienta."
  - "6. Publicación (#76–#79): va después de la entrega y no compite con ella; se puede aplazar, pero el repo no se hace público sin #79."

# -----------------------------------------------------------------------------
# Tareas, numeradas en orden de ejecución
# -----------------------------------------------------------------------------
items:

  # ===================== Sprint 1 · Cimientos =====================

  - id: "01"
    title: "Completar la configuración del repo y del tablero"
    epic: E1
    type: gestion
    area: gestion
    owners: [A]
    reviewers: [B]
    sprint: S1
    phase: start
    points: 3
    priority: P0
    depends_on: []
    goal: >-
      Dejar el repo nuevo y el GitHub Project listos para trabajar: colaboradores, permisos,
      vistas, automatizaciones y protección de ramas; y el repo, preparado desde el principio para
      hacerse público al acabar (CONTRIBUTING §14).
    acceptance:
      - "Repo creado desde cero con el contenido actual (datos comprimidos, README, Diario, `pyproject.toml`, `uv.lock` y kit de gestión) en `main`, y rama `develop` creada desde `main`."
      - "@MiguelBanosB y @fizge son colaboradores con permiso *Write* (invitación aceptada) y tienen asignadas sus tareas (relanzar `apply` si faltaba alguno)."
      - "Bootstrap ejecutado: labels, milestones, tareas numeradas (#N = tarea N), épicas, sub-issues y dependencias."
      - "Project vinculado al repo, con @MiguelBanosB y @fizge como *Admin* (Settings → Manage access)."
      - "Columnas Backlog · Ready · In progress · In review · Done y campos *Puntos*, *Revisor*, *Inicio* y *Fin* rellenados."
      - "Vistas creadas (a mano si la API falla, según `gestion/README.md`) y workflows activos: auto-add, item cerrado → Done, PR fusionada → Done y PR enlazada → In review (si existe)."
      - "Protección de `main` y `develop`: PR obligatoria, 1 aprobación y conversaciones resueltas (o constancia en el Diario si el plan de GitHub no lo permite)."
      - "Captura del tablero en `doc/img/tablero_S1.png` para la memoria."
      - "Repo apto para ser público: `Data/*.tar.gz`, `enunciado.pdf` y los dos `github-plantillas.zip` fuera del índice **y del historial** (`git filter-repo`) mientras solo existe el commit inicial; force-push coordinado de `main`, `develop` y `feat/05-eda-t1` (quitando un momento la protección) y los otros dos vuelven a clonar."
      - "Datos fuera de git: `Data/` en `.gitignore`, `Data/SHA256SUMS` versionado y descarga documentada en el README desde las fuentes oficiales (pln-inco-resources y gmordecki/TA1C) hasta que #11 la automatice."
      - "Los tres usan como `user.email` su dirección *noreply* de GitHub y activan «Keep my email addresses private»; el commit inicial se reescribe con esa dirección (`git filter-repo --mailmap`)."
      - "Decisión anotada en el Diario: los datos dejan de versionarse (sustituye a la entrada del 2026-10-21)."
    notes: "La hace quien crea el repo: solo el propietario puede cambiar ajustes, permisos y el Project."

  - id: "02"
    title: "Revisar entre los tres el proceso, el plan y el reparto"
    epic: E1
    type: gestion
    area: gestion
    owners: [A, B, C]
    reviewers: [B, C]
    sprint: S1
    phase: start
    points: 1
    priority: P0
    depends_on: []
    goal: >-
      Que los tres conozcan y acepten la forma de trabajar antes de empezar: tablero, Definition
      of Ready/Done, ramas, revisión cruzada, protocolo de benchmarks y reparto de tareas.
    acceptance:
      - "Los tres han leído `CONTRIBUTING.md`, `doc/benchmarks/PROTOCOLO.md` y `gestion/ROADMAP.md`."
      - "Reparto de tareas y de revisores aceptado o ajustado; los cambios se hacen directamente en el tablero."
      - "Cambios al proceso, si los hay, en una PR aprobada por los otros dos."
      - "La entrada del Diario «Metodología de trabajo» pasa de **Pendiente** a **Adoptado**."

  - id: "03"
    title: "Sprint 1 · Planning"
    epic: E1
    type: gestion
    area: gestion
    owners: [A, B, C]
    reviewers: [C]
    sprint: S1
    phase: start
    points: 1
    priority: P0
    depends_on: []
    goal: >-
      Comprometer el alcance del Sprint 1 con capacidad realista y dueños claros.
    acceptance: &planning
      - "Objetivo del sprint escrito en la descripción de la milestone."
      - "Issues del sprint revisados con la Definition of Ready (objetivo, criterios, puntos, dueño, revisor y dependencias) y movidos a *Ready*."
      - "Capacidad declarada por cada miembro (horas) y carga planificada ≤ capacidad; si no, recorte según `gestion/ROADMAP.md`."
      - "Vista «Sprint actual» filtrada por la milestone del sprint."
      - "Registro de riesgos revisado."
      - "Acta breve en el Diario: fecha, objetivo, compromisos y capacidad."

  - id: "04"
    title: "Estructura del repositorio y paquete `tapln`"
    epic: E2
    type: infra
    area: comun
    owners: [A]
    reviewers: [B]
    sprint: S1
    points: 2
    priority: P0
    depends_on: []
    goal: >-
      Esqueleto común para que el código de T1, T2 y la plataforma no diverja.
    acceptance:
      - "Layout creado: `src/tapln/{data,retrieval,llm,bench,eval,t1,t2}/`, `configs/`, `prompts/`, `scripts/`, `tests/`, `notebooks/`, `results/` (según CONTRIBUTING §Estructura)."
      - "`pyproject.toml` con `build-system` y entrypoint `tapln`; `uv run tapln --help` funciona."
