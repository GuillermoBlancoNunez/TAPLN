    acceptance:
      - "`notebooks/eda_t1.ipynb` y figuras en `doc/img/`: distribución de clases por split, medio y país; longitudes; n-gramas más asociados a cada clase (χ² o PMI); URLs, emojis, interrogaciones y números."
      - "Acuerdo entre anotadores (κ de Fleiss) con `deteccion_extra` y % de tweets con desacuerdo → techo humano estimado."
      - "≥3 conclusiones accionables (preprocesado, prompts, selección de ejemplos) en el Diario."
      - "Solo train y dev: `test_gold` no se inspecciona."
    notes: "Puede empezar con pandas antes de que se fusione #11."

  - id: "06"
    title: "Estado del arte de T1"
    epic: E5
    type: docs
    area: T1
    owners: [B]
    reviewers: [A]
    sprint: S1
    points: 2
    priority: P0
    depends_on: []
    goal: >-
      Partir de lo que funcionó en TA1C 2025 y justificar qué probamos y por qué.
    acceptance:
      - "Lectura del overview de TA1C 2025, de los papers de participantes (CEUR Vol-4098) y de Mordecki et al. (2024)."
      - "Tabla en `doc/estado_del_arte.md`: equipo, enfoque, modelo, recursos y macro-F1 en test."
      - "≥3 técnicas candidatas a probar, cada una con su fuente."
      - "Referencias en `doc/memoria/referencias.bib`."

  - id: "07"
    title: "EDA de spoiling (train y dev)"
    epic: E6
    type: feature
    area: T2
    owners: [C]
    reviewers: [A]
    sprint: S1
    points: 2
    priority: P0
    depends_on: []
    goal: >-
      Conocer los artículos y los spoilers para decidir longitud, chunking y prompt con
